name: 📰 News Scraper

on:
  schedule:
    - cron: '0 0 * * *'      # 北京时间 08:00 — 新闻日报
    - cron: '30 15 * * *'    # 北京时间 23:30 — JINSA 第一次检查
    - cron: '0 17 * * *'     # 北京时间 01:00 — JINSA 第二次检查
    - cron: '0 7 * * 0'           # 北京时间 15:00，每周日触发（job 内判断是否第1/3个周日）
    - cron: '*/10 * * * *'       # 每10分钟 — 业绩快报+电话会纪要轮询
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式 (news / jinsa / earnings / earnings-poll)'
        required: false
        default: 'news'

permissions:
  contents: write

jobs:
  # ── 1. 每日新闻日报（北京时间 08:00）──────────────────────────────────────
  scrape-and-push:
    if: >
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'news' || github.event.inputs.mode == '')) ||
      github.event.schedule == '0 0 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v5

      - name: 🐍 设置 Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 安装依赖
        run: pip install -r requirements.txt

      - name: 🚀 运行新闻抓取
        env:
          FEISHU_WEBHOOK:    ${{ secrets.FEISHU_WEBHOOK }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper.py news

  # ── 2. JINSA 战情推送（北京时间 23:30 和 01:00）──────────────────────────
  jinsa-push:
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'jinsa') ||
      github.event.schedule == '30 15 * * *' ||
      github.event.schedule == '0 17 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v5

      - name: 🐍 设置 Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 安装依赖
        run: pip install -r requirements.txt

      - name: 📊 检查并推送 JINSA
        env:
          FEISHU_WEBHOOK:    ${{ secrets.FEISHU_WEBHOOK }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper.py jinsa

      - name: 💾 保存推送状态
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: jinsa-state
          path: jinsa_sent.json
          retention-days: 7

  # ── 3. 业绩日历（北京时间每月第1和第3个周日 15:00）──────────────────────
  earnings-calendar:
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'earnings') ||
      github.event.schedule == '0 7 * * 0'
    runs-on: ubuntu-latest
    steps:
      - name: 📆 检查是否第1或第3个周日
        if: github.event_name != 'workflow_dispatch'
        id: week_check
        run: |
          DAY=$(date -u +%d)
          if [ "$DAY" -le 7 ] || ([ "$DAY" -ge 15 ] && [ "$DAY" -le 21 ]); then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ 跳过：今天是第 $DAY 日，不是第1或第3个周日"
          fi

      - name: 📥 检出代码
        if: github.event_name == 'workflow_dispatch' || steps.week_check.outputs.should_run == 'true'
        uses: actions/checkout@v5

      - name: 🐍 设置 Python 3.11
        if: github.event_name == 'workflow_dispatch' || steps.week_check.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 安装依赖
        if: github.event_name == 'workflow_dispatch' || steps.week_check.outputs.should_run == 'true'
        run: pip install -r requirements.txt yfinance

      - name: 📅 推送业绩日历
        if: github.event_name == 'workflow_dispatch' || steps.week_check.outputs.should_run == 'true'
        env:
          FEISHU_WEBHOOK_EARNINGS:   ${{ secrets.FEISHU_WEBHOOK_EARNINGS }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper.py earnings

      - name: 💾 提交业绩日程文件
        if: github.event_name == 'workflow_dispatch' || steps.week_check.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add earnings_schedule.json
          git diff --cached --quiet || git commit -m "更新 Tier 1 业绩轮询日程"
          git push

  # ── 4. 业绩快报 + 电话会纪要轮询（每10分钟）─────────────────────────────
  earnings-poll:
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'earnings-poll') ||
      github.event.schedule == '*/10 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v5

      - name: 📋 检查是否有待处理日程
        id: schedule_check
        run: |
          if [ -f earnings_schedule.json ] && grep -q '"pending"' earnings_schedule.json; then
            echo "has_pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pending=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ 无待处理的业绩日程"
          fi

      - name: 🐍 设置 Python 3.11
        if: steps.schedule_check.outputs.has_pending == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 安装依赖
        if: steps.schedule_check.outputs.has_pending == 'true'
        run: pip install -r requirements.txt yfinance

      - name: 🔔 轮询业绩快报 + 电话会纪要
        if: steps.schedule_check.outputs.has_pending == 'true'
        env:
          FEISHU_WEBHOOK_EARNINGS:   ${{ secrets.FEISHU_WEBHOOK_EARNINGS }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper.py earnings-poll

      - name: 💾 更新日程状态
        if: steps.schedule_check.outputs.has_pending == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add earnings_schedule.json
          git diff --cached --quiet || (git commit -m "更新业绩轮询状态" && git push)
